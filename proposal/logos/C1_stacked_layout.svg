<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap');
    </style>

    <linearGradient id="grad1_stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B9B8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F5F5A;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow_stack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2B9B8F;stop-opacity:0" />
    </radialGradient>

    <filter id="shadow_stack">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="200" cy="120" r="70" fill="url(#glow_stack)"/>

  <!-- Mark: Base curve -->
  <path d="M 120 190 Q 200 150, 280 190"
        fill="none"
        stroke="url(#grad1_stack)"
        stroke-width="9"
        stroke-linecap="round"
        filter="url(#shadow_stack)"
        opacity="0.9"/>

  <!-- Mark: Middle curve -->
  <path d="M 110 150 Q 200 95, 290 150"
        fill="none"
        stroke="url(#grad1_stack)"
        stroke-width="9"
        stroke-linecap="round"
        filter="url(#shadow_stack)"
        opacity="0.95"/>

  <!-- Mark: Top curve -->
  <path d="M 100 110 Q 200 45, 300 110"
        fill="none"
        stroke="url(#grad1_stack)"
        stroke-width="9"
        stroke-linecap="round"
        filter="url(#shadow_stack)"
        opacity="1"/>

  <!-- Center focal point -->
  <circle cx="200" cy="120" r="3.5" fill="#2B9B8F" opacity="0.6"/>

  <!-- Wordmark: Main text -->
  <text x="200" y="310"
        font-family="Lora, serif"
        font-size="64"
        font-weight="700"
        text-anchor="middle"
        fill="#1F5F5A"
        letter-spacing="3">TRIAD</text>

  <!-- Wordmark: Subtitle -->
  <text x="200" y="365"
        font-family="Lora, serif"
        font-size="18"
        font-weight="400"
        text-anchor="middle"
        fill="#2B9B8F"
        letter-spacing="2">THERAPEUTIC CLINIC</text>
</svg>
