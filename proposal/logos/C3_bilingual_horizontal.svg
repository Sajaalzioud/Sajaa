<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    </style>

    <radialGradient id="grad3_primary_bilingual" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#3EEAE8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E9B97;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D4D4A;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="grad3_secondary_bilingual" cx="60%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8FFCE8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4DB8A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F7A6B;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="grad3_accent_bilingual" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFB88C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E8845D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B84420;stop-opacity:1" />
    </radialGradient>

    <filter id="soft_glow_c3_bilingual">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft_shadow_bilingual">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="0.75" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.08" result="offsetcolor"/>
      <feComposite in="offsetcolor" in2="offsetblur" operator="in" result="offsetblur"/>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top-left organic form (care) -->
  <path d="M 105 65 Q 90 75 97 105 Q 105 125 122 125 Q 135 125 138 110 Q 142 90 130 75 Q 120 60 105 65 Z"
        fill="url(#grad3_primary_bilingual)"
        filter="url(#soft_shadow_bilingual)"
        opacity="0.85"/>

  <!-- Top-right organic form (healing) -->
  <path d="M 165 70 Q 190 58 185 95 Q 180 120 160 127 Q 140 132 133 105 Q 125 88 140 75 Q 155 62 165 70 Z"
        fill="url(#grad3_accent_bilingual)"
        filter="url(#soft_shadow_bilingual)"
        opacity="0.82"/>

  <!-- Bottom center organic form (growth) -->
  <path d="M 135 115 Q 115 140 125 170 Q 147 190 175 185 Q 195 182 185 150 Q 178 120 155 115 Q 142 112 135 115 Z"
        fill="url(#grad3_secondary_bilingual)"
        filter="url(#soft_shadow_bilingual)"
        opacity="0.83"/>

  <!-- Connecting threads -->
  <path d="M 125 100 Q 135 107 145 115"
        fill="none"
        stroke="#3EEAE8"
        stroke-width="1"
        opacity="0.35"
        stroke-linecap="round"/>

  <!-- Center focal point -->
  <circle cx="135" cy="110" r="1.8"
          fill="#3EEAE8"
          filter="url(#soft_glow_c3_bilingual)"
          opacity="0.7"/>

  <!-- English text on right side -->
  <text x="380" y="130"
        font-family="Inter, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#0D4D4A"
        letter-spacing="2.5">TRIAD</text>

  <text x="380" y="170"
        font-family="Inter, sans-serif"
        font-size="17"
        font-weight="600"
        fill="#1E9B97"
        letter-spacing="1.5">THERAPEUTIC CLINIC</text>

  <!-- Arabic text on far right side (RTL) -->
  <text x="1080" y="130"
        font-family="Cairo, sans-serif"
        font-size="56"
        font-weight="700"
        text-anchor="end"
        fill="#0D4D4A"
        letter-spacing="2">ترياد</text>

  <text x="1080" y="170"
        font-family="Cairo, sans-serif"
        font-size="17"
        font-weight="600"
        text-anchor="end"
        fill="#1E9B97"
        letter-spacing="1.5">العيادة العلاجية</text>

  <!-- Divider line -->
  <line x1="730" y1="60" x2="730" y2="220"
        stroke="#1E9B97"
        stroke-width="1"
        opacity="0.2"
        stroke-dasharray="3,2"/>
</svg>
