<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2_icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099B3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad2_accent_icon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5FE3C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2FB89C;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow_c2_icon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D9D9;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0099B3;stop-opacity:0" />
    </radialGradient>

    <filter id="glow_effect_c2_icon">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="100" cy="85" r="45" fill="url(#glow_c2_icon)"/>

  <!-- Left hexagon-like form -->
  <path d="M 75 70 L 85 60 L 95 70 L 90 95 L 78 100 Z"
        fill="url(#grad2_icon)"
        filter="url(#glow_effect_c2_icon)"
        opacity="0.9"/>

  <!-- Center hexagon-like form -->
  <path d="M 95 70 L 110 58 L 120 70 L 115 100 L 100 106 Z"
        fill="url(#grad2_accent_icon)"
        filter="url(#glow_effect_c2_icon)"
        opacity="0.95"/>

  <!-- Right hexagon-like form -->
  <path d="M 120 70 L 135 58 L 145 78 L 138 102 L 120 105 Z"
        fill="url(#grad2_icon)"
        filter="url(#glow_effect_c2_icon)"
        opacity="0.88"/>

  <!-- Connecting lines showing integration -->
  <line x1="95" y1="70" x2="110" y2="58"
        stroke="#00D9D9"
        stroke-width="1"
        opacity="0.5"
        stroke-linecap="round"/>

  <line x1="90" y1="95" x2="110" y2="88"
        stroke="#5FE3C0"
        stroke-width="1"
        opacity="0.5"
        stroke-linecap="round"/>

  <line x1="120" y1="70" x2="135" y2="58"
        stroke="#00D9D9"
        stroke-width="1"
        opacity="0.5"
        stroke-linecap="round"/>

  <!-- Center integration node -->
  <circle cx="110" cy="80" r="2"
          fill="#00D9D9"
          filter="url(#glow_effect_c2_icon)"
          opacity="0.85"/>
</svg>
