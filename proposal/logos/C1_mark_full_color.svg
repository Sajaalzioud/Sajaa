<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1_mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B9B8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F5F5A;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow_mark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2B9B8F;stop-opacity:0" />
    </radialGradient>

    <filter id="shadow_mark">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="150" cy="130" r="80" fill="url(#glow_mark)"/>

  <!-- Base curve (foundation) -->
  <path d="M 80 200 Q 150 160, 220 200"
        fill="none"
        stroke="url(#grad1_mark)"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#shadow_mark)"
        opacity="0.9"/>

  <!-- Middle curve (growth) -->
  <path d="M 70 160 Q 150 105, 230 160"
        fill="none"
        stroke="url(#grad1_mark)"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#shadow_mark)"
        opacity="0.95"/>

  <!-- Top curve (ascension) -->
  <path d="M 60 120 Q 150 60, 240 120"
        fill="none"
        stroke="url(#grad1_mark)"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#shadow_mark)"
        opacity="1"/>

  <!-- Center focal point -->
  <circle cx="150" cy="130" r="3.5" fill="#2B9B8F" opacity="0.6"/>
</svg>
