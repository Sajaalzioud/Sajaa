<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap');
    </style>

    <linearGradient id="id_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F3F5;stop-opacity:1" />
    </linearGradient>

    <filter id="id_shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="50"
        font-family="Lora, serif"
        font-size="40"
        font-weight="700"
        text-anchor="middle"
        fill="#1F5F5A"
        letter-spacing="1">STAFF ID BADGE MOCKUP</text>

  <text x="600" y="85"
        font-family="Inter, sans-serif"
        font-size="14"
        text-anchor="middle"
        fill="#666">Vertical Badge 2" × 3" (51mm × 76mm) - Front & Back</text>

  <!-- Front of ID card -->
  <g filter="url(#id_shadow)">
    <!-- Card background -->
    <rect x="100" y="150" width="380" height="580" fill="url(#id_bg)" stroke="#AAA" stroke-width="1" rx="8"/>

    <!-- Top section with brand color -->
    <rect x="100" y="150" width="380" height="100" fill="#2B9B8F" stroke="none" rx="8 8 0 0"/>

    <!-- Logo and clinic name on colored header -->
    <circle cx="155" cy="185" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

    <text x="290" y="210"
          font-family="Lora, serif"
          font-size="28"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="1" text-anchor="middle">TRIAD</text>

    <!-- Photo area -->
    <rect x="120" y="180" width="120" height="150" fill="#E0E0E0" stroke="#BBB" stroke-width="1"/>
    <text x="180" y="260"
          font-family="Inter, sans-serif"
          font-size="12"
          text-anchor="middle"
          fill="#999">PHOTO</text>

    <!-- Staff details -->
    <text x="260" y="200"
          font-family="Inter, sans-serif"
          font-size="10"
          font-weight="600"
          fill="#333">ID: STF-2024-0847</text>

    <text x="260" y="220"
          font-family="Inter, sans-serif"
          font-size="11"
          font-weight="600"
          fill="#333">Name:</text>
    <text x="260" y="235"
          font-family="Inter, sans-serif"
          font-size="9"
          fill="#555">Sarah Johnson</text>

    <text x="260" y="255"
          font-family="Inter, sans-serif"
          font-size="11"
          font-weight="600"
          fill="#333">Position:</text>
    <text x="260" y="270"
          font-family="Inter, sans-serif"
          font-size="9"
          fill="#555">Physical Therapist</text>

    <!-- Separator line -->
    <line x1="120" y1="350" x2="460" y2="350" stroke="#2B9B8F" stroke-width="1" opacity="0.3"/>

    <!-- Badge details -->
    <text x="130" y="375"
          font-family="Inter, sans-serif"
          font-size="9"
          font-weight="600"
          fill="#333">CREDENTIAL VERIFICATION:</text>

    <text x="130" y="395"
          font-family="Inter, sans-serif"
          font-size="8"
          fill="#555">License: PT-2020-1234567
Expiry: 12/31/2026
Access Level: Clinical Staff</text>

    <text x="130" y="430"
          font-family="Inter, sans-serif"
          font-size="8"
        fill="#999">Valid only with photo identification.
Report to Security if badge is lost.</text>

    <!-- Department section -->
    <text x="130" y="460"
          font-family="Inter, sans-serif"
          font-size="10"
          font-weight="600"
          fill="#1F5F5A">Department: Physical Therapy
Contact: +966 12 345 6789</text>

    <!-- Barcode area (placeholder) -->
    <rect x="130" y="480" width="300" height="50" fill="none" stroke="#2B9B8F" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
    <text x="280" y="510"
          font-family="Inter, sans-serif"
          font-size="9"
          text-anchor="middle"
          fill="#999">Barcode/RFID Area</text>
  </g>

  <!-- Back of ID card -->
  <g filter="url(#id_shadow)">
    <rect x="570" y="150" width="380" height="580" fill="#FFFFFF" stroke="#AAA" stroke-width="1" rx="8"/>

    <!-- Top accent -->
    <rect x="570" y="150" width="380" height="6" fill="#2B9B8F" rx="8 8 0 0"/>

    <!-- Emergency contact section -->
    <text x="590" y="190"
          font-family="Inter, sans-serif"
          font-size="11"
          font-weight="600"
          fill="#1F5F5A">EMERGENCY INFORMATION:</text>

    <text x="590" y="215"
          font-family="Inter, sans-serif"
          font-size="9"
          fill="#333">Blood Type: O+
Allergies: None Known
Emergency Contact: Michael Johnson
Relationship: Spouse
Phone: +966 50 123 4567</text>

    <!-- Clinic information -->
    <text x="590" y="290"
          font-family="Inter, sans-serif"
          font-size="11"
          font-weight="600"
          fill="#1F5F5A">CLINIC INFORMATION:</text>

    <text x="590" y="315"
          font-family="Inter, sans-serif"
          font-size="8"
          fill="#555">TRIAD Therapeutic Clinic
Medical Center District
Riyadh, Saudi Arabia

Tel: +966 12 345 6789
Email: staff@triadclinic.com
Website: www.triadclinic.com</text>

    <!-- Code of conduct -->
    <text x="590" y="390"
          font-family="Inter, sans-serif"
          font-size="10"
          font-weight="600"
          fill="#1F5F5A">STAFF CODE OF CONDUCT:</text>

    <text x="590" y="410"
          font-family="Inter, sans-serif"
          font-size="8"
          fill="#666">✓ Patient confidentiality
✓ Professional standards
✓ Infection control
✓ Safety protocols</text>

    <!-- Signature area -->
    <line x1="590" y1="460" x2="930" y2="460" stroke="#2B9B8F" stroke-width="1" opacity="0.3"/>
    <text x="590" y="485"
          font-family="Inter, sans-serif"
          font-size="8"
          fill="#333">Authorized Signature        Issued Date: 01/15/2024</text>

    <!-- Lost/found instructions -->
    <rect x="590" y="510" width="320" height="180" fill="#F8FAFB" stroke="#D0D0D0" stroke-width="1" rx="3"/>

    <text x="605" y="535"
          font-family="Inter, sans-serif"
          font-size="9"
          font-weight="600"
          fill="#1F5F5A">IF FOUND, PLEASE RETURN TO:</text>

    <text x="605" y="560"
          font-family="Inter, sans-serif"
          font-size="8"
          fill="#555">TRIAD Therapeutic Clinic
Reception Desk
Medical Center District, Riyadh
Saudi Arabia

Tel: +966 12 345 6789
security@triadclinic.com

Reward offered for safe return</text>
  </g>

  <!-- Specifications -->
  <text x="100" y="820"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="600"
        fill="#333">SPECIFICATIONS:</text>

  <text x="100" y="850"
        font-family="Arial, sans-serif"
        font-size="10"
        fill="#555">• Card: 300gsm PVC with UV coating for durability
• Dimensions: 2" × 3" (51mm × 76mm) - Vertical format
• Photo: Color photo on front (1.2" × 1.5" area)
• Features: Magnetic stripe or RFID chip for access control
• Printing: Full color front/back with security printing
• Lamination: Clear protective laminate with rounded corners
• Wear method: Lanyard with retractable reel (standard healthcare)
• Expiration: 2-3 years from issue date
• Replacement cost: $15-25 per badge</text>

  <text x="100" y="950"
        font-family="Arial, sans-serif"
        font-size="11"
        fill="#999">Mockup shows Concept 1 (Elegant & Luxury) professional healthcare ID badge</text>
</svg>
