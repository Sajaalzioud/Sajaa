<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_mark_white">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base curve (foundation) -->
  <path d="M 80 200 Q 150 160, 220 200"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#shadow_mark_white)"
        opacity="0.95"/>

  <!-- Middle curve (growth) -->
  <path d="M 70 160 Q 150 105, 230 160"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#shadow_mark_white)"
        opacity="1"/>

  <!-- Top curve (ascension) -->
  <path d="M 60 120 Q 150 60, 240 120"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#shadow_mark_white)"
        opacity="1"/>

  <!-- Center focal point -->
  <circle cx="150" cy="130" r="3.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
