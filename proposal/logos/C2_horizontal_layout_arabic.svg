<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap');
    </style>

    <linearGradient id="grad2_horiz_ar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099B3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad2_accent_horiz_ar" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5FE3C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2FB89C;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow_c2_horiz_ar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D9D9;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0099B3;stop-opacity:0" />
    </radialGradient>

    <filter id="glow_effect_c2_horiz_ar">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="800" cy="100" r="50" fill="url(#glow_c2_horiz_ar)"/>

  <!-- Mark: Left hexagon -->
  <path d="M 770 80 L 780 70 L 792 80 L 788 105 L 772 110 Z"
        fill="url(#grad2_horiz_ar)"
        filter="url(#glow_effect_c2_horiz_ar)"
        opacity="0.9"/>

  <!-- Mark: Center hexagon -->
  <path d="M 792 80 L 808 68 L 820 80 L 815 110 L 798 116 Z"
        fill="url(#grad2_accent_horiz_ar)"
        filter="url(#glow_effect_c2_horiz_ar)"
        opacity="0.95"/>

  <!-- Mark: Right hexagon -->
  <path d="M 820 80 L 835 68 L 845 88 L 838 112 L 820 115 Z"
        fill="url(#grad2_horiz_ar)"
        filter="url(#glow_effect_c2_horiz_ar)"
        opacity="0.88"/>

  <!-- Mark: Connecting lines -->
  <line x1="792" y1="80" x2="808" y2="68"
        stroke="#00D9D9"
        stroke-width="1"
        opacity="0.5"
        stroke-linecap="round"/>

  <line x1="788" y1="105" x2="807" y2="98"
        stroke="#5FE3C0"
        stroke-width="1"
        opacity="0.5"
        stroke-linecap="round"/>

  <!-- Mark: Center node -->
  <circle cx="807" cy="90" r="2"
          fill="#00D9D9"
          filter="url(#glow_effect_c2_horiz_ar)"
          opacity="0.85"/>

  <!-- Arabic Wordmark on left (RTL) -->
  <!-- Main text -->
  <text x="620" y="130"
        font-family="Cairo, sans-serif"
        font-size="70"
        font-weight="700"
        text-anchor="end"
        fill="#0099B3"
        letter-spacing="3">ترياد</text>

  <!-- Subtitle -->
  <text x="620" y="175"
        font-family="Cairo, sans-serif"
        font-size="19"
        font-weight="600"
        text-anchor="end"
        fill="#00D9D9"
        letter-spacing="1.5">العيادة العلاجية</text>
</svg>
