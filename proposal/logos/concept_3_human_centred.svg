<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    </style>

    <!-- Gradients -->
    <radialGradient id="grad3_primary" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#3EEAE8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E9B97;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D4D4A;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="grad3_secondary" cx="60%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8FFCE8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4DB8A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F7A6B;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="grad3_accent" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFB88C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E8845D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B84420;stop-opacity:1" />
    </radialGradient>

    <!-- Filters -->
    <filter id="soft_glow_c3">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft_shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.08" result="offsetcolor"/>
      <feComposite in="offsetcolor" in2="offsetblur" operator="in" result="offsetblur"/>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CONCEPT 3: HUMAN-CENTRED & WARM -->
  <!-- Three overlapping organic forms representing harmonious, human-centered care -->

  <!-- Top-left organic form (care) -->
  <path d="M 190 190 Q 160 200 170 240 Q 180 270 210 270 Q 235 270 240 245 Q 245 215 225 195 Q 210 180 190 190 Z"
        fill="url(#grad3_primary)"
        filter="url(#soft_shadow)"
        opacity="0.85"/>

  <!-- Top-right organic form (healing) -->
  <path d="M 310 195 Q 350 180 340 230 Q 335 270 305 280 Q 270 285 260 250 Q 250 220 270 200 Q 290 185 310 195 Z"
        fill="url(#grad3_accent)"
        filter="url(#soft_shadow)"
        opacity="0.82"/>

  <!-- Bottom center organic form (growth) -->
  <path d="M 235 260 Q 200 290 220 340 Q 250 365 290 360 Q 320 355 305 310 Q 295 275 260 265 Q 245 260 235 260 Z"
        fill="url(#grad3_secondary)"
        filter="url(#soft_shadow)"
        opacity="0.83"/>

  <!-- Connecting threads (subtle lines of care) -->
  <path d="M 220 240 Q 235 250 250 265"
        fill="none"
        stroke="#3EEAE8"
        stroke-width="1.5"
        opacity="0.35"
        stroke-linecap="round"/>

  <path d="M 280 240 Q 270 250 260 265"
        fill="none"
        stroke="#FFB88C"
        stroke-width="1.5"
        opacity="0.35"
        stroke-linecap="round"/>

  <path d="M 240 245 Q 250 255 260 270"
        fill="none"
        stroke="#8FFCE8"
        stroke-width="1.5"
        opacity="0.35"
        stroke-linecap="round"/>

  <!-- Center focal point (heart of care) -->
  <circle cx="250" cy="250" r="3.5"
          fill="#3EEAE8"
          filter="url(#soft_glow_c3)"
          opacity="0.7"/>

  <!-- Decorative accents -->
  <circle cx="215" cy="220" r="1.5"
          fill="#1E9B97"
          opacity="0.25"/>

  <circle cx="290" cy="225" r="1.5"
          fill="#B84420"
          opacity="0.25"/>

  <!-- Text -->
  <text x="250" y="380"
        font-family="Inter, sans-serif"
        font-size="38"
        font-weight="700"
        text-anchor="middle"
        fill="#0D4D4A"
        letter-spacing="2">TRIAD</text>

  <text x="250" y="420"
        font-family="Inter, sans-serif"
        font-size="13"
        font-weight="600"
        text-anchor="middle"
        fill="#1E9B97"
        letter-spacing="0.5">THERAPEUTIC CLINIC</text>

  <!-- Design notes -->
  <text x="250" y="455"
        font-family="Arial, sans-serif"
        font-size="10"
        text-anchor="middle"
        fill="#999">Concept 3: Human-Centred & Warm</text>

  <text x="250" y="470"
        font-family="Arial, sans-serif"
        font-size="9"
        text-anchor="middle"
        fill="#AAA">Organic forms symbolize holistic, compassionate patient care</text>
</svg>