<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2_mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099B3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad2_accent_mark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5FE3C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2FB89C;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow_c2_mark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D9D9;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0099B3;stop-opacity:0" />
    </radialGradient>

    <filter id="glow_effect_c2_mark">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="150" cy="130" r="70" fill="url(#glow_c2_mark)"/>

  <!-- Left hexagon-like form -->
  <path d="M 120 110 L 135 95 L 150 105 L 145 130 L 125 135 Z"
        fill="url(#grad2_mark)"
        filter="url(#glow_effect_c2_mark)"
        opacity="0.9"/>

  <!-- Center hexagon-like form -->
  <path d="M 150 105 L 170 90 L 185 105 L 180 135 L 155 142 Z"
        fill="url(#grad2_accent_mark)"
        filter="url(#glow_effect_c2_mark)"
        opacity="0.95"/>

  <!-- Right hexagon-like form -->
  <path d="M 185 105 L 205 90 L 220 110 L 212 140 L 190 145 Z"
        fill="url(#grad2_mark)"
        filter="url(#glow_effect_c2_mark)"
        opacity="0.88"/>

  <!-- Connecting lines showing integration -->
  <line x1="150" y1="105" x2="170" y2="90"
        stroke="#00D9D9"
        stroke-width="1.5"
        opacity="0.5"
        stroke-linecap="round"/>

  <line x1="145" y1="130" x2="167" y2="122"
        stroke="#5FE3C0"
        stroke-width="1.5"
        opacity="0.5"
        stroke-linecap="round"/>

  <line x1="185" y1="105" x2="205" y2="90"
        stroke="#00D9D9"
        stroke-width="1.5"
        opacity="0.5"
        stroke-linecap="round"/>

  <!-- Center integration node -->
  <circle cx="168" cy="115" r="3"
          fill="#00D9D9"
          filter="url(#glow_effect_c2_mark)"
          opacity="0.85"/>
</svg>
