<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    </style>

    <radialGradient id="grad3_primary_horiz_ar" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#3EEAE8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E9B97;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D4D4A;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="grad3_secondary_horiz_ar" cx="60%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8FFCE8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4DB8A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F7A6B;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="grad3_accent_horiz_ar" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFB88C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E8845D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B84420;stop-opacity:1" />
    </radialGradient>

    <filter id="soft_glow_c3_horiz_ar">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft_shadow_horiz_ar">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="0.75" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.08" result="offsetcolor"/>
      <feComposite in="offsetcolor" in2="offsetblur" operator="in" result="offsetblur"/>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top-left organic form (care) -->
  <path d="M 745 65 Q 730 75 737 105 Q 745 125 762 125 Q 775 125 778 110 Q 782 90 770 75 Q 760 60 745 65 Z"
        fill="url(#grad3_primary_horiz_ar)"
        filter="url(#soft_shadow_horiz_ar)"
        opacity="0.85"/>

  <!-- Top-right organic form (healing) -->
  <path d="M 805 70 Q 830 58 825 95 Q 820 120 800 127 Q 780 132 773 105 Q 765 88 780 75 Q 795 62 805 70 Z"
        fill="url(#grad3_accent_horiz_ar)"
        filter="url(#soft_shadow_horiz_ar)"
        opacity="0.82"/>

  <!-- Bottom center organic form (growth) -->
  <path d="M 775 115 Q 755 140 765 170 Q 787 190 815 185 Q 835 182 825 150 Q 818 120 795 115 Q 782 112 775 115 Z"
        fill="url(#grad3_secondary_horiz_ar)"
        filter="url(#soft_shadow_horiz_ar)"
        opacity="0.83"/>

  <!-- Connecting threads -->
  <path d="M 765 100 Q 775 107 785 115"
        fill="none"
        stroke="#3EEAE8"
        stroke-width="1"
        opacity="0.35"
        stroke-linecap="round"/>

  <path d="M 785 100 Q 780 107 775 115"
        fill="none"
        stroke="#FFB88C"
        stroke-width="1"
        opacity="0.35"
        stroke-linecap="round"/>

  <!-- Center focal point -->
  <circle cx="775" cy="110" r="1.8"
          fill="#3EEAE8"
          filter="url(#soft_glow_c3_horiz_ar)"
          opacity="0.7"/>

  <!-- Arabic Wordmark on left (RTL) -->
  <!-- Main text -->
  <text x="620" y="130"
        font-family="Cairo, sans-serif"
        font-size="66"
        font-weight="700"
        text-anchor="end"
        fill="#0D4D4A"
        letter-spacing="2.5">ترياد</text>

  <!-- Subtitle -->
  <text x="620" y="175"
        font-family="Cairo, sans-serif"
        font-size="18"
        font-weight="600"
        text-anchor="end"
        fill="#1E9B97"
        letter-spacing="1.5">العيادة العلاجية</text>
</svg>
