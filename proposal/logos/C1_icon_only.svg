<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1_icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B9B8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F5F5A;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow_icon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2B9B8F;stop-opacity:0" />
    </radialGradient>

    <filter id="shadow_icon">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="100" cy="85" r="55" fill="url(#glow_icon)"/>

  <!-- Base curve (foundation) -->
  <path d="M 35 145 Q 100 110, 165 145"
        fill="none"
        stroke="url(#grad1_icon)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#shadow_icon)"
        opacity="0.9"/>

  <!-- Middle curve (growth) -->
  <path d="M 25 105 Q 100 60, 175 105"
        fill="none"
        stroke="url(#grad1_icon)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#shadow_icon)"
        opacity="0.95"/>

  <!-- Top curve (ascension) -->
  <path d="M 15 65 Q 100 20, 185 65"
        fill="none"
        stroke="url(#grad1_icon)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#shadow_icon)"
        opacity="1"/>

  <!-- Center focal point -->
  <circle cx="100" cy="85" r="2.5" fill="#2B9B8F" opacity="0.6"/>
</svg>
