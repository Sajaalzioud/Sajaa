<svg viewBox="0 0 1400 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    </style>

    <linearGradient id="hero_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F0F2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="button_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B9B8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F5F5A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="40"
        font-family="Lora, serif"
        font-size="36"
        font-weight="700"
        text-anchor="middle"
        fill="#1F5F5A"
        letter-spacing="1">WEBSITE MOCKUP</text>

  <text x="700" y="75"
        font-family="Inter, sans-serif"
        font-size="13"
        text-anchor="middle"
        fill="#666">Desktop Header & Hero Section - 1400px Wide</text>

  <!-- Header navigation bar -->
  <rect x="0" y="120" width="1400" height="100" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>

  <!-- Logo on left -->
  <circle cx="80" cy="170" r="30" fill="none" stroke="#2B9B8F" stroke-width="2.5" opacity="0.85"/>
  <text x="150" y="165"
        font-family="Lora, serif"
        font-size="32"
        font-weight="700"
        fill="#1F5F5A"
        letter-spacing="1">TRIAD</text>

  <text x="150" y="190"
        font-family="Inter, sans-serif"
        font-size="10"
        fill="#2B9B8F"
        letter-spacing="0.5">THERAPEUTIC CLINIC</text>

  <!-- Navigation menu -->
  <text x="500" y="155"
        font-family="Inter, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#333">About Us</text>

  <text x="600" y="155"
        font-family="Inter, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#333">Services</text>

  <text x="700" y="155"
        font-family="Inter, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#333">Team</text>

  <text x="790" y="155"
        font-family="Inter, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#333">Contact</text>

  <!-- CTA Button -->
  <rect x="1100" y="140" width="240" height="50" fill="url(#button_gradient)" rx="4"/>
  <text x="1220" y="172"
        font-family="Inter, sans-serif"
        font-size="13"
        font-weight="600"
        text-anchor="middle"
        fill="#FFFFFF">Schedule Appointment</text>

  <!-- Hero Section -->
  <rect x="0" y="220" width="1400" height="500" fill="url(#hero_bg)"/>

  <!-- Hero Image placeholder -->
  <rect x="50" y="240" width="600" height="460" fill="#D4DFE3" stroke="#AAA" stroke-width="1"/>
  <text x="350" y="470"
        font-family="Inter, sans-serif"
        font-size="14"
        text-anchor="middle"
        fill="#999">Professional Healthcare Image</text>

  <!-- Hero Text -->
  <text x="750" y="280"
        font-family="Lora, serif"
        font-size="48"
        font-weight="700"
        fill="#1F5F5A"
        letter-spacing="2">Transforming
Healthcare</text>

  <text x="750" y="320"
        font-family="Lora, serif"
        font-size="48"
        font-weight="700"
        fill="#2B9B8F"
        letter-spacing="2">With Care</text>

  <text x="750" y="375"
        font-family="Inter, sans-serif"
        font-size="14"
        fill="#555">Experience integrated therapeutic care designed around your
wellness journey. Our multidisciplinary team is dedicated to
your recovery and long-term health.</text>

  <!-- CTA Button in hero -->
  <rect x="750" y="420" width="200" height="45" fill="url(#button_gradient)" rx="3"/>
  <text x="850" y="450"
        font-family="Inter, sans-serif"
        font-size="12"
        font-weight="600"
        text-anchor="middle"
        fill="#FFFFFF">Learn More</text>

  <!-- Features Section -->
  <text x="700" y="790"
        font-family="Lora, serif"
        font-size="32"
        font-weight="700"
        text-anchor="middle"
        fill="#1F5F5A"
        letter-spacing="1">Our Services</text>

  <!-- Feature cards -->
  <g>
    <!-- Card 1 -->
    <rect x="80" y="850" width="360" height="280" fill="#FFFFFF" stroke="#DDD" stroke-width="1" rx="8"/>
    <circle cx="130" cy="890" r="25" fill="none" stroke="#2B9B8F" stroke-width="2" opacity="0.8"/>
    <text x="250" y="910"
          font-family="Lora, serif"
          font-size="20"
          font-weight="700"
          fill="#1F5F5A">Rehabilitation</text>
    <text x="100" y="950"
          font-family="Inter, sans-serif"
          font-size="11"
          fill="#555">Comprehensive rehabilitation programs tailored to your specific needs and recovery goals.</text>

    <!-- Card 2 -->
    <rect x="520" y="850" width="360" height="280" fill="#FFFFFF" stroke="#DDD" stroke-width="1" rx="8"/>
    <circle cx="570" cy="890" r="25" fill="none" stroke="#2B9B8F" stroke-width="2" opacity="0.8"/>
    <text x="690" y="910"
          font-family="Lora, serif"
          font-size="20"
          font-weight="700"
          fill="#1F5F5A">Physical Therapy</text>
    <text x="540" y="950"
          font-family="Inter, sans-serif"
          font-size="11"
          fill="#555">Expert physical therapy delivered by certified professionals using latest techniques.</text>

    <!-- Card 3 -->
    <rect x="960" y="850" width="360" height="280" fill="#FFFFFF" stroke="#DDD" stroke-width="1" rx="8"/>
    <circle cx="1010" cy="890" r="25" fill="none" stroke="#2B9B8F" stroke-width="2" opacity="0.8"/>
    <text x="1130" y="910"
          font-family="Lora, serif"
          font-size="20"
          font-weight="700"
          fill="#1F5F5A">Holistic Care</text>
    <text x="980" y="950"
          font-family="Inter, sans-serif"
          font-size="11"
          fill="#555">Integrated approach addressing physical, mental, and emotional wellness components.</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="1280" width="1400" height="320" fill="#FAFBFC" stroke="#DDD" stroke-width="1"/>

  <!-- Footer logo area -->
  <circle cx="80" cy="1340" r="25" fill="none" stroke="#2B9B8F" stroke-width="2" opacity="0.7"/>
  <text x="140" y="1350"
        font-family="Lora, serif"
        font-size="24"
        font-weight="700"
        fill="#1F5F5A"
        letter-spacing="1">TRIAD</text>

  <!-- Footer content -->
  <text x="700" y="1330"
        font-family="Inter, sans-serif"
        font-size="10"
        font-weight="600"
        fill="#333">CONTACT US</text>

  <text x="700" y="1360"
        font-family="Inter, sans-serif"
        font-size="9"
        fill="#555">Medical Center District, Riyadh
Tel: +966 12 345 6789
Email: info@triadclinic.com</text>

  <text x="1100" y="1330"
        font-family="Inter, sans-serif"
        font-size="10"
        font-weight="600"
        fill="#333">FOLLOW US</text>

  <text x="1100" y="1360"
        font-family="Inter, sans-serif"
        font-size="9"
        fill="#2B9B8F">Facebook | Twitter | Instagram | LinkedIn</text>

  <!-- Footer divider -->
  <line x1="50" y1="1400" x2="1350" y2="1400" stroke="#D0D0D0" stroke-width="1"/>

  <!-- Footer bottom -->
  <text x="700" y="1480"
        font-family="Inter, sans-serif"
        font-size="8"
        text-anchor="middle"
        fill="#999">© 2024 TRIAD Therapeutic Clinic. All rights reserved.
Privacy Policy | Terms of Service | Accessibility</text>

  <!-- Specifications -->
  <text x="50" y="1550"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#333">SPECIFICATIONS: Logo placement: Top-left header (250-300px height) | Hero section: Full-width with logo integration | Footer: Secondary logo placement (150-200px) | Responsive design scales logo for mobile (32px minimum)</text>
</svg>
