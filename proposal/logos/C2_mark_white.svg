<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow_effect_c2_white">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left hexagon-like form -->
  <path d="M 120 110 L 135 95 L 150 105 L 145 130 L 125 135 Z"
        fill="#FFFFFF"
        filter="url(#glow_effect_c2_white)"
        opacity="0.95"/>

  <!-- Center hexagon-like form -->
  <path d="M 150 105 L 170 90 L 185 105 L 180 135 L 155 142 Z"
        fill="#FFFFFF"
        filter="url(#glow_effect_c2_white)"
        opacity="1"/>

  <!-- Right hexagon-like form -->
  <path d="M 185 105 L 205 90 L 220 110 L 212 140 L 190 145 Z"
        fill="#FFFFFF"
        filter="url(#glow_effect_c2_white)"
        opacity="0.92"/>

  <!-- Connecting lines showing integration -->
  <line x1="150" y1="105" x2="170" y2="90"
        stroke="#FFFFFF"
        stroke-width="1.5"
        opacity="0.6"
        stroke-linecap="round"/>

  <line x1="145" y1="130" x2="167" y2="122"
        stroke="#FFFFFF"
        stroke-width="1.5"
        opacity="0.6"
        stroke-linecap="round"/>

  <line x1="185" y1="105" x2="205" y2="90"
        stroke="#FFFFFF"
        stroke-width="1.5"
        opacity="0.6"
        stroke-linecap="round"/>

  <!-- Center integration node -->
  <circle cx="168" cy="115" r="3"
          fill="#FFFFFF"
          filter="url(#glow_effect_c2_white)"
          opacity="0.9"/>
</svg>
